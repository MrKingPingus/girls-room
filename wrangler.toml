# Cloudflare — static site deployed as a Worker with static assets.
#
# This matches the "Workers Builds" flow: Cloudflare runs `npm run build` to produce dist/,
# then `npx wrangler deploy`, which reads this file. There is no Worker script — an assets-only
# Worker just serves the built files, which is all a static page needs.
#
# The repo can stay private; Cloudflare builds private repos on the free plan.

name = "girls-room"
compatibility_date = "2025-01-01"

[assets]
directory = "./dist"
